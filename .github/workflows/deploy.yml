name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # 블로그 content 폴더 변경 시에만 빌드 트리거
      - "Jeakyoung_Blog/**"
      - "quartz.config.ts"
      - "quartz.layout.ts"
      - "quartz.custom.scss"
      - "quartz.overrides/**"
      - "quartz.static/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:  # 수동 트리거 허용

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout obsidian vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clone Quartz v4
        run: |
          git clone https://github.com/jackyzha0/quartz.git quartz-build
          cd quartz-build
          git checkout v4.4.0

      - name: Install Quartz dependencies
        run: |
          cd quartz-build
          npm ci

      - name: Copy quartz config
        run: |
          cp quartz.config.ts quartz-build/quartz.config.ts

          # 파비콘 / 링크 미리보기(OG) 썸네일. Quartz 는 quartz/static/icon.png(favicon),
          # quartz/static/og-image.png(1200x675, og:image) 두 파일만 읽으므로 그 자리를 덮어쓴다.
          cp quartz.static/icon.png quartz-build/quartz/static/icon.png
          cp quartz.static/og-image.png quartz-build/quartz/static/og-image.png

          # 레이아웃 커스터마이징 (Explorer/TOC/Graph/Backlinks 구성, 홈페이지 전용 처리 포함)
          cp quartz.layout.ts quartz-build/quartz.layout.ts

          # 커스텀 스타일. Quartz 는 quartz/styles/custom.scss 하나만 읽으므로
          # 저장소 루트의 quartz.custom.scss 로 그 파일을 통째로 덮어쓴다.
          # (파일 첫 줄의 `@use "./base.scss";` 가 기본 스타일을 끌어온다.)
          cp quartz.custom.scss quartz-build/quartz/styles/custom.scss

          # 컴포넌트 오버라이드 (원본 Quartz 컴포넌트 파일을 그 자리에서 통째로 교체)
          # - FolderContent: 폴더 인덱스 페이지의 문서 목록 중복 제거
          # - Backlinks: 역링크가 없는 페이지에서는 빈 블록을 보여주지 않음
          # - ExplorerNode: 탐색기 링크에 title(hover 툴팁) 속성 추가
          cp quartz.overrides/FolderContent.tsx quartz-build/quartz/components/pages/FolderContent.tsx
          cp quartz.overrides/Backlinks.tsx quartz-build/quartz/components/Backlinks.tsx
          cp quartz.overrides/ExplorerNode.tsx quartz-build/quartz/components/ExplorerNode.tsx

      - name: Copy vault content to Quartz
        run: |
          # Quartz content 폴더 초기화
          rm -rf quartz-build/content
          mkdir -p quartz-build/content

          # Jeakyoung_Blog 폴더 전체를 content 로 복사한다 (05_Archive 제외).
          # 첨부 이미지(Jeakyoung_Blog/resources/)도 content 안에 그대로 들어가야
          # ![[...]] 임베드가 Quartz 에서 해석된다. static/ 으로 따로 복사하지 말 것.
          rsync -av \
            --exclude="05_Archive/" \
            --exclude=".obsidian/" \
            Jeakyoung_Blog/ \
            quartz-build/content/

      - name: Build Quartz
        run: |
          cd quartz-build
          npx quartz build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz-build/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
